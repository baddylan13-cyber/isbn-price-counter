<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ISBN 本体価格カウンター</title>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        sans-serif;
      max-width: 700px;
      margin: 0 auto;
      padding: 20px;
      background: #f5f5f5;
      color: #222;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin: 0 0 20px;
    }

    .summary {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .summary-row {
      display: flex;
      gap: 10px;
      text-align: center;
    }

    .summary-item {
      flex: 1;
    }

    .summary-label {
      font-size: 14px;
      color: #666;
    }

    .summary-value {
      font-size: 28px;
      font-weight: bold;
      margin-top: 5px;
    }

    .section {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .section h2 {
      font-size: 18px;
      margin: 0 0 15px;
    }

    #cameraArea {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 10px;
      background: #111;
    }

    #video {
      display: block;
      width: 100%;
      height: auto;
    }

    #scanGuide {
      position: absolute;
      left: 5%;
      right: 5%;
      top: 35%;
      height: 30%;
      border: 3px solid #00e676;
      border-radius: 10px;
      pointer-events: none;
    }

    #scanGuide::after {
      content: "ISBNの数字をここに合わせてください";

      position: absolute;
      left: 0;
      right: 0;
      bottom: -38px;

      text-align: center;

      color: white;
      background: rgba(0,0,0,0.7);

      padding: 6px;
      font-size: 13px;
    }

    #canvas {
      display: none;
    }

    #previewArea {
      display: none;
      margin-top: 15px;
    }

    #preview {
      width: 100%;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    .debug-box {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #f1f1f1;
    }

    .debug-title {
      font-size: 13px;
      color: #666;
      margin-bottom: 6px;
    }

    #ocrResult {
      white-space: pre-wrap;
      word-break: break-all;
      font-family: monospace;
      font-size: 16px;
      min-height: 24px;
    }

    #detectedISBN {
      font-weight: bold;
      font-size: 18px;
      color: #007a4d;
      min-height: 24px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #007aff;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    button:disabled {
      background: #aaa;
    }

    #scanButton {
      background: #00a86b;
    }

    #stopCamera {
      background: #666;
    }

    #resetButton {
      background: #d9534f;
    }

    #status {
      text-align: center;
      min-height: 24px;
      margin: 14px 0;
      font-size: 14px;
      color: #555;
    }

    .manual-row {
      display: flex;
      gap: 8px;
    }

    .manual-row input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .manual-row button {
      width: 100px;
      margin-top: 0;
    }

    #bookList {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    #bookList li {
      padding: 12px 4px;
      border-bottom: 1px solid #eee;
    }

    #bookList li:last-child {
      border-bottom: none;
    }

    .book-title {
      font-weight: bold;
    }

    .book-info {
      margin-top: 4px;
      font-size: 13px;
      color: #666;
    }

    .note {
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.6;
      color: #666;
    }
  </style>
</head>


<body>

  <h1>ISBN 本体価格カウンター</h1>


  <!-- 集計 -->

  <div class="summary">

    <div class="summary-row">

      <div class="summary-item">

        <div class="summary-label">
          冊数
        </div>

        <div
          class="summary-value"
          id="totalBooks"
        >
          0
        </div>

      </div>


      <div class="summary-item">

        <div class="summary-label">
          本体価格合計
        </div>

        <div class="summary-value">

          <span id="totalPrice">
            0
          </span>

          円

        </div>

      </div>

    </div>

  </div>


  <!-- カメラ -->

  <div class="section">

    <h2>
      📷 カメラでISBNを読み取る
    </h2>


    <div id="cameraArea">

      <video
        id="video"
        playsinline
        autoplay
        muted
      ></video>

      <div id="scanGuide"></div>

    </div>


    <canvas id="canvas"></canvas>


    <div id="previewArea">

      <div
        style="
          font-size:13px;
          color:#666;
          margin-bottom:5px;
        "
      >
        OCRに実際に渡した画像
      </div>

      <img
        id="preview"
        alt="OCR画像"
      >

    </div>


    <div id="status">
      「カメラを起動」を押してください
    </div>


    <button id="startCamera">
      📷 カメラを起動
    </button>


    <button
      id="scanButton"
      disabled
    >
      🔍 この画像を読み取る
    </button>


    <button
      id="stopCamera"
      disabled
    >
      カメラを停止
    </button>


    <!-- デバッグ情報 -->

    <div class="debug-box">

      <div class="debug-title">
        OCRが実際に認識した文字
      </div>

      <div id="ocrResult">
        まだ読み取っていません
      </div>

    </div>


    <div class="debug-box">

      <div class="debug-title">
        ISBNとして抽出した結果
      </div>

      <div id="detectedISBN">
        まだありません
      </div>

    </div>


    <div class="note">

      今は原因調査のため、
      OCRが実際に何を読み取ったか表示しています。<br>

      ISBNの数字を緑の枠に合わせてから
      「この画像を読み取る」を押してください。

    </div>

  </div>


  <!-- 手入力 -->

  <div class="section">

    <h2>
      ⌨️ ISBNを手入力
    </h2>

    <div class="manual-row">

      <input
        type="text"
        id="isbnInput"
        placeholder="978xxxxxxxxxx"
        inputmode="numeric"
      >

      <button id="addButton">
        追加
      </button>

    </div>

  </div>


  <!-- 本一覧 -->

  <div class="section">

    <h2>
      📚 読み取った本
    </h2>

    <ul id="bookList"></ul>

  </div>


  <!-- リセット -->

  <div class="section">

    <button id="resetButton">
      🔄 すべてリセット
    </button>

  </div>


<script>


  /* =========================
     状態
  ========================= */

  let totalBooks = 0;

  let totalPrice = 0;

  let stream = null;

  let ocrWorker = null;

  let ocrReady = false;

  let processing = false;


  /* =========================
     DOM
  ========================= */

  const video =
    document.getElementById("video");

  const canvas =
    document.getElementById("canvas");

  const ctx =
    canvas.getContext("2d");

  const preview =
    document.getElementById("preview");

  const previewArea =
    document.getElementById("previewArea");

  const statusText =
    document.getElementById("status");

  const ocrResult =
    document.getElementById("ocrResult");

  const detectedISBN =
    document.getElementById("detectedISBN");

  const startButton =
    document.getElementById("startCamera");

  const scanButton =
    document.getElementById("scanButton");

  const stopButton =
    document.getElementById("stopCamera");

  const resetButton =
    document.getElementById("resetButton");

  const isbnInput =
    document.getElementById("isbnInput");

  const addButton =
    document.getElementById("addButton");


  /* =========================
     効果音
  ========================= */

  function beep() {

    try {

      const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

      const audioContext =
        new AudioContext();

      const oscillator =
        audioContext.createOscillator();

      const gain =
        audioContext.createGain();

      oscillator.type =
        "sine";

      oscillator.frequency.value =
        880;

      gain.gain.value =
        0.12;

      oscillator.connect(gain);

      gain.connect(
        audioContext.destination
      );

      oscillator.start();

      oscillator.stop(
        audioContext.currentTime + 0.12
      );

    } catch (error) {

      console.log(
        "beep error",
        error
      );

    }

  }


  /* =========================
     ISBN-13チェック
  ========================= */

  function isValidISBN13(isbn) {

    if (!/^\d{13}$/.test(isbn)) {
      return false;
    }

    if (
      !isbn.startsWith("978") &&
      !isbn.startsWith("979")
    ) {
      return false;
    }

    let sum = 0;

    for (let i = 0; i < 12; i++) {

      const digit =
        Number(isbn[i]);

      if (i % 2 === 0) {
        sum += digit;
      } else {
        sum += digit * 3;
      }

    }

    const checkDigit =
      (10 - (sum % 10)) % 10;

    return (
      checkDigit ===
      Number(isbn[12])
    );

  }


  /* =========================
     OCR結果からISBNを探す
  ========================= */

  function findISBN(text) {

    if (!text) {
      return null;
    }


    /*
      まず全部数字にする
    */

    const digits =
      text.replace(/\D/g, "");


    /*
      13桁の連続数字
    */

    for (
      let i = 0;
      i <= digits.length - 13;
      i++
    ) {

      const candidate =
        digits.substring(
          i,
          i + 13
        );

      if (
        isValidISBN13(candidate)
      ) {

        return candidate;

      }

    }


    /*
      OCRがハイフンや空白を含む場合
    */

    const matches =
      text.match(
        /(?:978|979)[\d\s\-]{10,25}/g
      );


    if (matches) {

      for (
        const match of matches
      ) {

        const candidate =
          match.replace(/\D/g, "");


        if (
          candidate.length === 13 &&
          isValidISBN13(candidate)
        ) {

          return candidate;

        }

      }

    }


    return null;

  }


  /* =========================
     openBD
  ========================= */

  async function getBookInfo(isbn) {

    const url =
      "https://api.openbd.jp/v1/get?isbn=" +
      encodeURIComponent(isbn);


    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        "openBD通信エラー"
      );

    }


    const data =
      await response.json();


    if (
      !data ||
      !data[0]
    ) {

      throw new Error(
        "本が見つかりませんでした"
      );

    }


    const book =
      data[0];


    const summary =
      book.summary || {};


    const title =
      summary.title ||
      "タイトル不明";


    let price = null;


    try {

      const prices =
        book
          .onix
          .ProductSupply
          .SupplyDetail
          .Price;


      if (
        Array.isArray(prices)
      ) {

        for (
          const p of prices
        ) {

          const amount =
            Number(
              p.PriceAmount
            );


          if (
            Number.isFinite(amount) &&
            amount > 0
          ) {

            price = amount;

            break;

          }

        }

      }

    } catch (error) {

      console.log(
        "価格取得エラー",
        error
      );

    }


    if (price === null) {

      throw new Error(
        "本は見つかりましたが、本体価格を取得できませんでした"
      );

    }


    return {
      title,
      price,
      isbn
    };

  }


  /* =========================
     HTMLエスケープ
  ========================= */

  function escapeHTML(str) {

    return String(str)

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

  }


  /* =========================
     本を追加
  ========================= */

  async function addBook(isbn) {

    isbn =
      String(isbn)
        .replace(/\D/g, "");


    if (
      isbn.length !== 13 ||
      !isValidISBN13(isbn)
    ) {

      alert(
        "有効なISBN-13ではありません。\n" +
        "978または979から始まる13桁のISBNを入力してください。"
      );

      return false;

    }


    try {

      statusText.textContent =
        "本の情報を取得中…";


      const book =
        await getBookInfo(isbn);


      totalBooks++;

      totalPrice +=
        book.price;


      document.getElementById(
        "totalBooks"
      ).textContent =
        totalBooks;


      document.getElementById(
        "totalPrice"
      ).textContent =
        totalPrice.toLocaleString();


      const li =
        document.createElement("li");


      li.innerHTML = `

        <div class="book-title">
          ${escapeHTML(book.title)}
        </div>

        <div class="book-info">
          ISBN:
          ${book.isbn}
          ／ 本体価格:
          ${book.price.toLocaleString()}円
        </div>

      `;


      document.getElementById(
        "bookList"
      ).prepend(li);


      beep();


      statusText.textContent =
        "✓ 登録完了！";


      return true;


    } catch (error) {

      console.error(
        error
      );


      statusText.textContent =
        error.message ||
        "本の情報を取得できませんでした";


      return false;

    }

  }


  /* =========================
     OCR準備
  ========================= */

  async function initializeOCR() {

    if (
      ocrWorker &&
      ocrReady
    ) {

      return;

    }


    statusText.textContent =
      "OCRエンジンを準備しています…";


    try {

      ocrWorker =
        await Tesseract.createWorker(
          "eng"
        );


      await ocrWorker.setParameters({

        tessedit_char_whitelist:
          "0123456789-",

        tessedit_pageseg_mode:
          "7",

        user_defined_dpi:
          "300"

      });


      ocrReady = true;


      statusText.textContent =
        "OCR準備完了";

    } catch (error) {

      console.error(
        "OCR初期化エラー",
        error
      );

      throw error;

    }

  }


  /* =========================
     カメラ起動
  ========================= */

  async function startCamera() {

    if (stream) {
      return;
    }


    try {

      statusText.textContent =
        "カメラを起動しています…";


      stream =
        await navigator.mediaDevices.getUserMedia({

          video: {

            facingMode: {
              ideal: "environment"
            },

            width: {
              ideal: 1920
            },

            height: {
              ideal: 1080
            }

          },

          audio: false

        });


      video.srcObject =
        stream;


      await video.play();


      startButton.disabled =
        true;

      scanButton.disabled =
        false;

      stopButton.disabled =
        false;


      statusText.textContent =
        "ISBNの数字を緑の枠に合わせてください";


    } catch (error) {

      console.error(
        error
      );


      statusText.textContent =
        "カメラを起動できませんでした";


      alert(
        "カメラを起動できませんでした。\n\n" +
        "iPhoneのカメラ使用許可を確認してください。"
      );

    }

  }


  /* =========================
     カメラ停止
  ========================= */

  function stopCamera() {

    if (stream) {

      stream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

      stream = null;

    }


    video.srcObject =
      null;


    startButton.disabled =
      false;

    scanButton.disabled =
      true;

    stopButton.disabled =
      true;


    statusText.textContent =
      "カメラを停止しました";

  }


  /* =========================
     撮影画像作成
  ========================= */

  function captureImage() {

    if (
      !video.videoWidth ||
      !video.videoHeight
    ) {

      throw new Error(
        "カメラ映像を取得できません"
      );

    }


    const sourceWidth =
      video.videoWidth;

    const sourceHeight =
      video.videoHeight;


    /*
      現在の緑枠に対応する範囲
    */

    const cropX =
      sourceWidth * 0.05;

    const cropY =
      sourceHeight * 0.35;

    const cropWidth =
      sourceWidth * 0.90;

    const cropHeight =
      sourceHeight * 0.30;


    /*
      OCR用に3倍へ拡大
    */

    const scale = 3;


    canvas.width =
      Math.round(
        cropWidth * scale
      );

    canvas.height =
      Math.round(
        cropHeight * scale
      );


    /*
      高品質補間
    */

    ctx.imageSmoothingEnabled =
      true;

    ctx.imageSmoothingQuality =
      "high";


    ctx.filter =
      "contrast(1.35) brightness(1.05)";


    ctx.drawImage(

      video,

      cropX,
      cropY,
      cropWidth,
      cropHeight,

      0,
      0,
      canvas.width,
      canvas.height

    );


    ctx.filter =
      "none";


    /*
      画面に実際のOCR画像を表示
    */

    preview.src =
      canvas.toDataURL(
        "image/jpeg",
        0.95
      );


    previewArea.style.display =
      "block";


    return canvas;

  }


  /* =========================
     OCR実行
  ========================= */

  async function scanISBN() {

    if (
      !stream ||
      processing
    ) {

      return;

    }


    processing = true;

    scanButton.disabled =
      true;


    /*
      前回結果をクリア
    */

    ocrResult.textContent =
      "読み取り中…";

    detectedISBN.textContent =
      "読み取り中…";


    try {

      statusText.textContent =
        "画像を撮影しています…";


      /*
        少し待ってから撮影
      */

      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            300
          )
      );


      const image =
        captureImage();


      statusText.textContent =
        "OCRで文字を読み取っています…";


      const result =
        await ocrWorker.recognize(
          image
        );


      const text =
        result.data.text ||
        "";


      /*
        ★ここが今回一番重要
        OCRが実際に返した文字列を表示
      */

      if (text.trim()) {

        ocrResult.textContent =
          text;

      } else {

        ocrResult.textContent =
          "【OCR結果なし】";

      }


      console.log(
        "OCR結果:",
        text
      );


      /*
        ISBN抽出
      */

      const isbn =
        findISBN(text);


      if (isbn) {

        detectedISBN.textContent =
          isbn;

        statusText.textContent =
          "ISBNを認識しました！";


        /*
          openBDへ
        */

        await addBook(isbn);


      } else {

        detectedISBN.textContent =
          "ISBNとして認識できませんでした";


        statusText.textContent =
          "ISBNを読み取れませんでした";


        /*
          今回は原因調査なので
          alertではなく画面に結果を残す。
        */

      }


    } catch (error) {

      console.error(
        "OCRエラー:",
        error
      );


      ocrResult.textContent =
        "OCRエラー: " +
        error.message;


      detectedISBN.textContent =
        "エラー";


      statusText.textContent =
        "読み取り中にエラーが発生しました";


    } finally {

      processing = false;

      if (stream) {

        scanButton.disabled =
          false;

      }

    }

  }


  /* =========================
     リセット
  ========================= */

  function resetAll() {

    const confirmed =
      confirm(
        "読み取った本をすべて削除して、\n" +
        "冊数と本体価格を0に戻しますか？"
      );


    if (!confirmed) {
      return;
    }


    totalBooks = 0;

    totalPrice = 0;


    document.getElementById(
      "totalBooks"
    ).textContent =
      "0";


    document.getElementById(
      "totalPrice"
    ).textContent =
      "0";


    document.getElementById(
      "bookList"
    ).innerHTML =
      "";


    ocrResult.textContent =
      "まだ読み取っていません";


    detectedISBN.textContent =
      "まだありません";


    previewArea.style.display =
      "none";


    preview.src =
      "";


    statusText.textContent =
      stream
        ? "次の本を読み取れます"
        : "「カメラを起動」を押してください";


    isbnInput.value =
      "";

  }


  /* =========================
     手入力
  ========================= */

  addButton.addEventListener(
    "click",
    async () => {

      const isbn =
        isbnInput.value.trim();


      if (!isbn) {
        return;
      }


      const success =
        await addBook(isbn);


      if (success) {

        isbnInput.value =
          "";

      }

    }
  );


  isbnInput.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter"
      ) {

        addButton.click();

      }

    }
  );


  /* =========================
     ボタン
  ========================= */

  startButton.addEventListener(
    "click",
    async () => {

      startCamera();

      /*
        OCR準備も並行して開始
      */

      initializeOCR()
        .catch(
          error =>
            console.error(
              error
            )
        );

    }
  );


  scanButton.addEventListener(
    "click",
    scanISBN
  );


  stopButton.addEventListener(
    "click",
    stopCamera
  );


  resetButton.addEventListener(
    "click",
    resetAll
  );


  /* =========================
     ページ終了
  ========================= */

  window.addEventListener(
    "beforeunload",
    async () => {

      stopCamera();

      if (ocrWorker) {

        try {

          await ocrWorker.terminate();

        } catch (error) {

          console.log(error);
