<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISBN価格カウンター</title>

  <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      color: #222;
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    .box {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    #reader {
      position: relative;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 12px;
      background: #000;
    }

    #video {
      width: 100%;
      display: block;
      background: #000;
    }

    .guide {
      position: absolute;
      left: 8%;
      right: 8%;
      top: 35%;
      height: 30%;
      border: 3px solid #00ff66;
      border-radius: 8px;
      box-sizing: border-box;
      pointer-events: none;
    }

    .guide-text {
      position: absolute;
      left: 0;
      right: 0;
      top: 25%;
      text-align: center;
      color: white;
      font-weight: bold;
      text-shadow: 0 1px 4px black;
      pointer-events: none;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      background: #333;
      color: white;
    }

    button:active {
      opacity: 0.7;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      font-size: 17px;
      border: 1px solid #ccc;
      border-radius: 10px;
      margin-top: 8px;
    }

    .status {
      text-align: center;
      font-weight: bold;
      margin: 10px 0;
      min-height: 24px;
    }

    .totals {
      display: flex;
      justify-content: space-around;
      text-align: center;
    }

    .total-number {
      font-size: 28px;
      font-weight: bold;
    }

    .total-label {
      font-size: 13px;
      color: #666;
    }

    #bookList {
      margin-top: 10px;
    }

    .book {
      background: #fafafa;
      border-radius: 10px;
      padding: 10px;
      margin-top: 8px;
      border: 1px solid #eee;
    }

    .book-title {
      font-weight: bold;
    }

    .book-info {
      font-size: 13px;
      color: #666;
      margin-top: 4px;
    }

    .price {
      font-weight: bold;
      margin-top: 4px;
    }

    #resetButton {
      background: #b00020;
    }
  </style>
</head>

<body>

  <h1>📚 ISBN価格カウンター</h1>

  <div class="box">

    <div id="reader">
      <video id="video" autoplay playsinline muted></video>

      <div class="guide"></div>
      <div class="guide-text">
        ISBNバーコードを緑枠に合わせてください
      </div>
    </div>

    <div id="status" class="status">
      カメラを起動しています…
    </div>

    <button id="startButton">
      📷 カメラを起動
    </button>

    <button id="stopButton">
      ⏹ カメラを停止
    </button>

  </div>

  <div class="box">

    <strong>ISBNを手入力</strong>

    <input
      id="isbnInput"
      type="text"
      inputmode="numeric"
      placeholder="978xxxxxxxxxx"
    >

    <button id="manualButton">
      ISBNを追加
    </button>

  </div>

  <div class="box">

    <div class="totals">

      <div>
        <div class="total-number" id="totalBooks">0</div>
        <div class="total-label">冊</div>
      </div>

      <div>
        <div class="total-number">
          ¥<span id="totalPrice">0</span>
        </div>
        <div class="total-label">合計本体価格</div>
      </div>

    </div>

  </div>

  <div class="box">

    <strong>読み取った本</strong>

    <div id="bookList"></div>

  </div>

  <div class="box">

    <button id="resetButton">
      🔄 すべてリセット
    </button>

  </div>


<script>

  const video = document.getElementById("video");
  const statusText = document.getElementById("status");

  const startButton = document.getElementById("startButton");
  const stopButton = document.getElementById("stopButton");

  const isbnInput = document.getElementById("isbnInput");
  const manualButton = document.getElementById("manualButton");

  const totalBooksElement = document.getElementById("totalBooks");
  const totalPriceElement = document.getElementById("totalPrice");

  const bookList = document.getElementById("bookList");
  const resetButton = document.getElementById("resetButton");


  let codeReader = null;
  let controls = null;

  let totalBooks = 0;
  let totalPrice = 0;

  let lastISBN = "";
  let lastScanTime = 0;
  let processing = false;


  // -----------------------------
  // ビープ音
  // -----------------------------

  function beep() {

    try {

      const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

      const audioContext = new AudioContext();

      const oscillator =
        audioContext.createOscillator();

      const gain =
        audioContext.createGain();

      oscillator.frequency.value = 1000;
      oscillator.type = "sine";

      gain.gain.value = 0.15;

      oscillator.connect(gain);
      gain.connect(audioContext.destination);

      oscillator.start();

      setTimeout(() => {
        oscillator.stop();
        audioContext.close();
      }, 100);

    } catch (e) {

      console.log("beep error", e);

    }

  }


  // -----------------------------
  // ISBNチェック
  // -----------------------------

  function normalizeISBN(value) {

    return String(value || "")
      .replace(/[^0-9]/g, "");

  }


  function isValidISBN13(isbn) {

    isbn = normalizeISBN(isbn);

    if (!/^(978|979)\d{10}$/.test(isbn)) {
      return false;
    }

    let sum = 0;

    for (let i = 0; i < 12; i++) {

      const digit = Number(isbn[i]);

      sum +=
        i % 2 === 0
          ? digit
          : digit * 3;

    }

    const checkDigit =
      (10 - (sum % 10)) % 10;

    return checkDigit === Number(isbn[12]);

  }


  // -----------------------------
  // openBD
  // -----------------------------

  async function getBookInfo(isbn) {

    const url =
      "https://api.openbd.jp/v1/get?isbn=" +
      encodeURIComponent(isbn);

    const response = await fetch(url);

    if (!response.ok) {
      throw new Error("openBD error");
    }

    const data = await response.json();

    if (!data || !data[0]) {
      throw new Error("本が見つかりません");
    }

    const book = data[0];

    const summary =
      book.summary || {};

    const title =
      summary.title || "タイトル不明";

    let price = null;

    try {

      const prices =
        book.onix.ProductSupply.SupplyDetail.Price;

      if (Array.isArray(prices)) {

        for (const p of prices) {

          if (
            p.PriceAmount !== undefined &&
            Number(p.PriceAmount) > 0
          ) {

            price = Number(p.PriceAmount);
            break;

          }

        }

      }

    } catch (e) {

      console.log("価格取得エラー", e);

    }

    if (price === null) {

      throw new Error(
        "この本の価格情報を取得できませんでした"
      );

    }

    return {
      title,
      price
    };

  }


  // -----------------------------
  // 本を追加
  // -----------------------------

  async function addBook(isbn) {

    isbn = normalizeISBN(isbn);

    if (!isValidISBN13(isbn)) {

      statusText.textContent =
        "ISBN-13として認識できませんでした";

      return;

    }

    // 同じバーコードを連続して二重読み取りしない
    const now = Date.now();

    if (
      isbn === lastISBN &&
      now - lastScanTime < 2500
    ) {

      return;

    }

    lastISBN = isbn;
    lastScanTime = now;

    if (processing) {
      return;
    }

    processing = true;

    statusText.textContent =
      "📖 本の情報を取得しています…";

    try {

      const book =
        await getBookInfo(isbn);

      totalBooks++;
      totalPrice += book.price;

      totalBooksElement.textContent =
        totalBooks.toLocaleString();

      totalPriceElement.textContent =
        totalPrice.toLocaleString();

      const bookElement =
        document.createElement("div");

      bookElement.className = "book";

      bookElement.innerHTML = `
        <div class="book-title">
          ${escapeHTML(book.title)}
        </div>

        <div class="book-info">
          ISBN: ${isbn}
        </div>

        <div class="price">
          本体価格 ¥${book.price.toLocaleString()}
        </div>
      `;

      bookList.prepend(bookElement);

      beep();

      statusText.textContent =
        `✅ ${book.title} を追加しました`;

    } catch (error) {

      console.error(error);

      statusText.textContent =
        "⚠️ この本の価格情報を取得できませんでした";

    } finally {

      processing = false;

      setTimeout(() => {

        if (!processing) {

          statusText.textContent =
            "📷 次の本を読み取れます";

        }

      }, 1800);

    }

  }


  // -----------------------------
  // HTMLエスケープ
  // -----------------------------

  function escapeHTML(text) {

    const div =
      document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

  }


  // -----------------------------
  // カメラ開始
  // -----------------------------

  async function startCamera() {

    if (controls) {
      return;
    }

    statusText.textContent =
      "📷 カメラを起動しています…";

    try {

      codeReader =
        new ZXing.BrowserMultiFormatReader();

      const videoInputDevices =
        await codeReader.listVideoInputDevices();

      if (!videoInputDevices.length) {

        throw new Error(
          "カメラが見つかりません"
        );

      }

      // 背面カメラを優先
      let selectedDevice =
        videoInputDevices.find(device =>
          /back|rear|environment/i.test(
            device.label
          )
        );

      if (!selectedDevice) {
        selectedDevice =
          videoInputDevices[
            videoInputDevices.length - 1
          ];
      }


      controls =
        await codeReader.decodeFromVideoDevice(
          selectedDevice.deviceId,
          video,
          (result, error) => {

            if (result) {

              const text =
                result.getText();

              console.log(
                "Barcode detected:",
                text
              );

              const isbn =
                normalizeISBN(text);

              if (isValidISBN13(isbn)) {

                addBook(isbn);

              } else {

                console.log(
                  "EAN-13だがISBNではない:",
                  text
                );

              }

            }

          }
        );


      statusText.textContent =
        "📷 ISBNバーコードを緑枠に合わせてください";

    } catch (error) {

      console.error(error);

      statusText.textContent =
        "❌ カメラを起動できませんでした";

    }

  }


  // -----------------------------
  // カメラ停止
  // -----------------------------

  function stopCamera() {

    if (controls) {

      controls.stop();
      controls = null;

    }

    if (codeReader) {

      try {
        codeReader.reset();
      } catch (e) {}

    }

    if (video.srcObject) {

      video.srcObject
        .getTracks()
        .forEach(track => track.stop());

      video.srcObject = null;

    }

    statusText.textContent =
      "⏹ カメラを停止しました";

  }


  // -----------------------------
  // 手入力
  // -----------------------------

  manualButton.addEventListener(
    "click",
    () => {

      const isbn =
        normalizeISBN(isbnInput.value);

      addBook(isbn);

      isbnInput.value = "";

    }
  );


  isbnInput.addEventListener(
    "keydown",
    event => {

      if (event.key === "Enter") {

        manualButton.click();

      }

    }
  );


  // -----------------------------
  // ボタン
  // -----------------------------

  startButton.addEventListener(
    "click",
    startCamera
  );

  stopButton.addEventListener(
    "click",
    stopCamera
  );


  // -----------------------------
  // リセット
  // -----------------------------

  resetButton.addEventListener(
    "click",
    () => {

      if (
        !confirm(
          "冊数・合計金額・読み取り履歴をすべてリセットしますか？"
        )
      ) {
        return;
      }

      totalBooks = 0;
      totalPrice = 0;

      lastISBN = "";
      lastScanTime = 0;

      totalBooksElement.textContent = "0";
      totalPriceElement.textContent = "0";

      bookList.innerHTML = "";

      isbnInput.value = "";

      statusText.textContent =
        "📷 次の本を読み取れます";

    }
  );


  // -----------------------------
  // 初期化
  // -----------------------------

  statusText.textContent =
    "📷「カメラを起動」を押してください";

</script>

</body>
</html>
