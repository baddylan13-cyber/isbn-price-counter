<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISBN 本体価格カウンター</title>

  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      background: #f7f7f7;
    }

    h1 {
      text-align: center;
      font-size: 24px;
    }

    .summary {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      text-align: center;
    }

    .number {
      font-size: 32px;
      font-weight: bold;
    }

    .input-area {
      background: white;
      padding: 20px;
      border-radius: 12px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 18px;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background: #333;
      color: white;
      cursor: pointer;
    }

    #bookList {
      margin-top: 20px;
    }

    .book {
      background: white;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <h1>ISBN 本体価格カウンター</h1>

  <div class="summary">
    <div>スキャン済み</div>
    <div class="number" id="totalBooks">0冊</div>

    <div>合計本体価格</div>
    <div class="number" id="totalPrice">0円</div>
  </div>

  <div class="input-area">
    <input
      type="text"
      id="isbnInput"
      placeholder="ISBNを入力"
      inputmode="numeric"
    >

    <button onclick="addBook()">本を追加</button>
  </div>

  <div id="bookList"></div>

  <script>
    let totalBooks = 0;
    let totalPrice = 0;

    function addBook() {
      const isbn = document.getElementById("isbnInput").value.trim();

      if (!isbn) {
        alert("ISBNを入力してください");
        return;
      }

      // 今はテストとして1000円の本として追加
      const price = 1000;

      totalBooks++;
      totalPrice += price;

      document.getElementById("totalBooks").textContent =
        totalBooks + "冊";

      document.getElementById("totalPrice").textContent =
        totalPrice.toLocaleString() + "円";

      const book = document.createElement("div");
      book.className = "book";
      book.textContent =
        "ISBN: " + isbn + " / 本体価格: " +
        price.toLocaleString() + "円";

      document.getElementById("bookList").appendChild(book);

      document.getElementById("isbnInput").value = "";
    }
  </script>

</body>
</html>
