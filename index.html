<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ISBN 本体価格カウンター</title>

  <!-- Tesseract.js OCR -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      max-width: 700px;
      margin: 0 auto;
      padding: 20px;
      background: #f5f5f5;
      color: #222;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 20px;
    }

    .summary {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      text-align: center;
    }

    .summary-row {
      display: flex;
      justify-content: space-around;
      gap: 10px;
    }

    .summary-item {
      flex: 1;
    }

    .summary-label {
      font-size: 14px;
      color: #666;
    }

    .summary-value {
      font-size: 28px;
      font-weight: bold;
      margin-top: 5px;
    }

    .section {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .section h2 {
      font-size: 18px;
      margin-top: 0;
    }

    #cameraArea {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 10px;
      background: #111;
      margin-bottom: 15px;
    }

    #video {
      width: 100%;
      display: block;
      transform: scaleX(1);
    }

    #scanGuide {
      position: absolute;
      left: 8%;
      right: 8%;
      top: 35%;
      height: 30%;
      border: 3px solid #00ff66;
      border-radius: 10px;
      box-sizing: border-box;
      pointer-events: none;
    }

    #scanGuide::after {
      content: "ISBNの数字をここに合わせてください";
      position: absolute;
      left: 0;
      right: 0;
      top: -32px;
      color: white;
      background: rgba(0,0,0,0.65);
      text-align: center;
      padding: 5px;
      font-size: 13px;
      border-radius: 5px;
    }

    #canvas {
      display: none;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #007aff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    button:disabled {
      background: #aaa;
      cursor: default;
    }

    #stopCamera {
      background: #666;
    }

    #status {
      text-align: center;
      margin: 12px 0;
      min-height: 24px;
      font-size: 14px;
      color: #555;
    }

    .manual-row {
      display: flex;
      gap: 8px;
    }

    .manual-row input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
    }

    .manual-row button {
      width: 120px;
      margin-top: 0;
    }

    #bookList {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    #bookList li {
      background: #fff;
      border-bottom: 1px solid #eee;
      padding: 12px 4px;
    }

    #bookList li:last-child {
      border-bottom: none;
    }

    .book-title {
      font-weight: bold;
    }

    .book-info {
      font-size: 13px;
      color: #666;
      margin-top: 4px;
    }

    .note {
      font-size: 13px;
      color: #666;
      line-height: 1.6;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <h1>ISBN 本体価格カウンター</h1>

  <!-- 集計 -->
  <div class="summary">
    <div class="summary-row">

      <div class="summary-item">
        <div class="summary-label">冊数</div>
        <div class="summary-value" id="totalBooks">0</div>
      </div>

      <div class="summary-item">
        <div class="summary-label">本体価格合計</div>
        <div class="summary-value">
          <span id="totalPrice">0</span>円
        </div>
      </div>

    </div>
  </div>


  <!-- カメラ -->
  <div class="section">

    <h2>📷 カメラでISBNを読み取る</h2>

    <div id="cameraArea">
      <video id="video" playsinline autoplay muted></video>
      <div id="scanGuide"></div>
    </div>

    <canvas id="canvas"></canvas>

    <div id="status">
      カメラを起動してください
    </div>

    <button id="startCamera">
      カメラを起動
    </button>

    <button id="stopCamera" disabled>
      カメラを停止
    </button>

    <div class="note">
      本のバーコードそのものではなく、バーコードの下に印刷されている
      「978〜」または「979〜」のISBN数字を読み取ります。
    </div>

  </div>


  <!-- 手入力 -->
  <div class="section">

    <h2>⌨️ ISBNを手入力</h2>

    <div class="manual-row">
      <input
        type="text"
        id="isbnInput"
        placeholder="978xxxxxxxxxx"
        inputmode="numeric"
      >

      <button id="addButton">
        追加
      </button>
    </div>

  </div>


  <!-- 読み取った本 -->
  <div class="section">

    <h2>📚 読み取った本</h2>

    <ul id="bookList"></ul>

  </div>


<script>

  /* =========================
     基本データ
  ========================= */

  let totalBooks = 0;
  let totalPrice = 0;

  let stream = null;
  let ocrWorker = null;

  let scanning = false;
  let processing = false;

  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const statusText = document.getElementById("status");

  const startButton = document.getElementById("startCamera");
  const stopButton = document.getElementById("stopCamera");

  const isbnInput = document.getElementById("isbnInput");
  const addButton = document.getElementById("addButton");


  /* =========================
     効果音
  ========================= */

  function beep() {

    try {

      const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

      const audioContext = new AudioContext();

      const oscillator =
        audioContext.createOscillator();

      const gain =
        audioContext.createGain();

      oscillator.frequency.value = 880;
      oscillator.type = "sine";

      gain.gain.value = 0.12;

      oscillator.connect(gain);
      gain.connect(audioContext.destination);

      oscillator.start();

      oscillator.stop(
        audioContext.currentTime + 0.12
      );

    } catch (e) {
      console.log("beep error", e);
    }

  }


  /* =========================
     ISBN-13チェック
  ========================= */

  function isValidISBN13(isbn) {

    if (!/^\d{13}$/.test(isbn)) {
      return false;
    }

    if (
      !isbn.startsWith("978") &&
      !isbn.startsWith("979")
    ) {
      return false;
    }

    let sum = 0;

    for (let i = 0; i < 12; i++) {

      const digit =
        Number(isbn[i]);

      sum +=
        i % 2 === 0
          ? digit
          : digit * 3;
    }

    const checkDigit =
      (10 - (sum % 10)) % 10;

    return checkDigit === Number(isbn[12]);
  }


  /* =========================
     OCR文字からISBN候補を探す
  ========================= */

  function findISBN(text) {

    if (!text) {
      return null;
    }

    /*
      OCRは

      978-4-...
      978 4 ...
      9784...

      のように色々な形で返す可能性があるので
      数字だけにする。
    */

    const numbers =
      text.replace(/\D/g, "");

    /*
      13桁の連続数字から探す
    */

    for (
      let i = 0;
      i <= numbers.length - 13;
      i++
    ) {

      const candidate =
        numbers.substring(i, i + 13);

      if (isValidISBN13(candidate)) {
        return candidate;
      }

    }

    /*
      OCR結果に改行などが入っている場合も考慮
    */

    const matches =
      text.match(/(?:978|979)[\d\s\-]{10,20}/g);

    if (matches) {

      for (const match of matches) {

        const candidate =
          match.replace(/\D/g, "");

        if (
          candidate.length === 13 &&
          isValidISBN13(candidate)
        ) {
          return candidate;
        }

      }

    }

    return null;
  }


  /* =========================
     openBDから本の情報取得
  ========================= */

  async function getBookInfo(isbn) {

    const url =
      "https://api.openbd.jp/v1/get?isbn=" +
      encodeURIComponent(isbn);

    const response =
      await fetch(url);

    if (!response.ok) {
      throw new Error("openBD通信エラー");
    }

    const data =
      await response.json();

    if (!data || !data[0]) {
      throw new Error("本が見つかりませんでした");
    }

    const book =
      data[0];

    const summary =
      book.summary || {};

    const title =
      summary.title || "タイトル不明";

    let price = null;

    try {

      const prices =
        book.onix.ProductSupply.SupplyDetail.Price;

      if (Array.isArray(prices)) {

        for (const p of prices) {

          const amount =
            Number(p.PriceAmount);

          if (
            Number.isFinite(amount) &&
            amount > 0
          ) {
            price = amount;
            break;
          }

        }

      }

    } catch (e) {
      console.log("価格取得エラー", e);
    }

    if (price === null) {
      throw new Error(
        "本は見つかりましたが、本体価格を取得できませんでした"
      );
    }

    return {
      title,
      price,
      isbn
    };

  }


  /* =========================
     本を追加
  ========================= */

  async function addBook(isbn) {

    isbn =
      String(isbn)
        .replace(/\D/g, "");

    if (
      isbn.length !== 13 ||
      !isValidISBN13(isbn)
    ) {

      alert(
        "有効なISBN-13ではありません。\n" +
        "978または979から始まる13桁のISBNを入力してください。"
      );

      return false;
    }

    try {

      statusText.textContent =
        "本の情報を取得中…";

      const book =
        await getBookInfo(isbn);

      totalBooks++;
      totalPrice += book.price;

      document.getElementById(
        "totalBooks"
      ).textContent = totalBooks;

      document.getElementById(
        "totalPrice"
      ).textContent =
        totalPrice.toLocaleString();


      const li =
        document.createElement("li");

      li.innerHTML = `
        <div class="book-title">
          ${escapeHTML(book.title)}
        </div>

        <div class="book-info">
          ISBN: ${book.isbn}
          ／ 本体価格: ${book.price.toLocaleString()}円
        </div>
      `;

      document.getElementById(
        "bookList"
      ).prepend(li);

      beep();

      statusText.textContent =
        "読み取り成功！ 次の本をどうぞ";

      return true;

    } catch (error) {

      console.error(error);

      statusText.textContent =
        error.message ||
        "本の情報を取得できませんでした";

      return false;
    }

  }


  /* =========================
     HTMLエスケープ
  ========================= */

  function escapeHTML(str) {

    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =========================
     OCR準備
  ========================= */

  async function initializeOCR() {

    if (ocrWorker) {
      return;
    }

    statusText.textContent =
      "OCRエンジンを準備しています…";

    /*
      英数字だけ読み取ればいいので
      日本語OCRではなく英語モデルを使用。
    */

    ocrWorker =
      await Tesseract.createWorker("eng");

    await ocrWorker.setParameters({

      tessedit_char_whitelist:
        "0123456789-",

      /*
        ISBNの数字列を読むため
        1行として扱う。
      */

      tessedit_pageseg_mode:
        "7"

    });

  }


  /* =========================
     カメラ起動
  ========================= */

  async function startCamera() {

    if (scanning) {
      return;
    }

    try {

      statusText.textContent =
        "カメラを起動しています…";

      /*
        OCRエンジンを先に準備
      */

      await initializeOCR();


      /*
        iPhone背面カメラ
      */

      stream =
        await navigator.mediaDevices.getUserMedia({

          video: {
            facingMode: {
              ideal: "environment"
            },

            width: {
              ideal: 1920
            },

            height: {
              ideal: 1080
            }
          },

          audio: false

        });


      video.srcObject = stream;

      await video.play();

      scanning = true;

      startButton.disabled = true;
      stopButton.disabled = false;

      statusText.textContent =
        "ISBNの数字を緑の枠に合わせてください";

      /*
        カメラ映像が安定してからOCR開始
      */

      setTimeout(
        scanLoop,
        1000
      );

    } catch (error) {

      console.error(error);

      statusText.textContent =
        "カメラを起動できませんでした";

      alert(
        "カメラを起動できませんでした。\n\n" +
        "iPhoneのカメラ使用許可を確認してください。"
      );

    }

  }


  /* =========================
     カメラ停止
  ========================= */

  function stopCamera() {

    scanning = false;

    if (stream) {

      stream
        .getTracks()
        .forEach(track => track.stop());

      stream = null;
    }

    video.srcObject = null;

    startButton.disabled = false;
    stopButton.disabled = true;

    statusText.textContent =
      "カメラを停止しました";

  }


  /* =========================
     OCR用画像作成
  ========================= */

  function captureFrame() {

    if (
      !video.videoWidth ||
      !video.videoHeight
    ) {
      return null;
    }

    /*
      OCRには高解像度の画像のほうが
      認識しやすいので、ある程度のサイズを確保。
    */

    const maxWidth = 1400;

    let width =
      video.videoWidth;

    let height =
      video.videoHeight;

    if (width > maxWidth) {

      const ratio =
        maxWidth / width;

      width =
        Math.round(width * ratio);

      height =
        Math.round(height * ratio);

    }

    canvas.width = width;
    canvas.height = height;

    /*
      映像全体を一度撮影。
      OCR側で文字列を探す。
    */

    ctx.drawImage(
      video,
      0,
      0,
      width,
      height
    );

    return canvas;

  }


  /* =========================
     OCRスキャン
  ========================= */

  async function performOCR() {

    if (
      !ocrWorker ||
      processing ||
      !scanning
    ) {
      return;
    }

    processing = true;

    try {

      statusText.textContent =
        "ISBNを探しています…";

      const image =
        captureFrame();

      if (!image) {
        processing = false;
        return;
      }


      const result =
        await ocrWorker.recognize(image);


      const text =
        result.data.text || "";

      console.log(
        "OCR:",
        text
      );


      const isbn =
        findISBN(text);


      if (isbn) {

        console.log(
          "ISBN発見:",
          isbn
        );

        /*
          一旦スキャンを止める。
          同じ本を二重登録しないため。
        */

        scanning = false;

        statusText.textContent =
          "ISBNを認識しました！";

        const success =
          await addBook(isbn);

        if (success) {

          /*
            少し待ってから
            次の本のスキャンを再開。
          */

          setTimeout(() => {

            if (stream) {
              scanning = true;
              scanLoop();
            }

          }, 800);

        } else {

          if (stream) {
            scanning = true;
            scanLoop();
          }

        }

      }

    } catch (error) {

      console.error(
        "OCR error:",
        error
      );

    } finally {

      processing = false;

    }

  }


  /* =========================
     OCRループ
  ========================= */

  function scanLoop() {

    if (!scanning) {
      return;
    }

    if (!processing) {
      performOCR();
    }

    /*
      OCRはかなり重いので
      常時毎フレームではなく
      少し間隔を空ける。
    */

    setTimeout(
      scanLoop,
      800
    );

  }


  /* =========================
     手入力
  ========================= */

  addButton.addEventListener(
    "click",
    async () => {

      const isbn =
        isbnInput.value.trim();

      if (!isbn) {
        return;
      }

      const success =
        await addBook(isbn);

      if (success) {
        isbnInput.value = "";
      }

    }
  );


  isbnInput.addEventListener(
    "keydown",
    event => {

      if (event.key === "Enter") {
        addButton.click();
      }

    }
  );


  /* =========================
     ボタン
  ========================= */

  startButton.addEventListener(
    "click",
    startCamera
  );

  stopButton.addEventListener(
    "click",
    stopCamera
  );


  /* =========================
     ページを離れるとき
  ========================= */

  window.addEventListener(
    "beforeunload",
    async () => {

      stopCamera();

      if (ocrWorker) {
        await ocrWorker.terminate();
        ocrWorker = null;
      }

    }
  );

</script>

</body>
</html>
