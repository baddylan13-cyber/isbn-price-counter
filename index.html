<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ISBN 本体価格カウンター</title>

  <!-- バーコードスキャン用ライブラリ -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      background: #f7f7f7;
      color: #333;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 20px;
    }

    .summary {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      text-align: center;
    }

    .summary-title {
      font-size: 14px;
      color: #666;
      margin-top: 10px;
    }

    .number {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    /* スキャンエリア */
    .scanner-area {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 10px;
    }

    .scan-button {
      margin-top: 10px;
      background: #333;
    }

    .stop-button {
      margin-top: 10px;
      background: #888;
    }

    .input-area {
      background: white;
      padding: 20px;
      border-radius: 12px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 18px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      background: #aaa;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      min-height: 24px;
    }

    #bookList {
      margin-top: 20px;
    }

    .book {
      background: white;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 8px;
    }

    .book-title {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .book-info {
      font-size: 14px;
      color: #666;
    }

    .book-price {
      font-size: 18px;
      font-weight: bold;
      margin-top: 8px;
    }
  </style>
</head>

<body>

  <h1>ISBN 本体価格カウンター</h1>


  <!-- 合計 -->
  <div class="summary">

    <div class="summary-title">
      スキャン済み
    </div>

    <div class="number" id="totalBooks">
      0冊
    </div>

    <div class="summary-title">
      合計本体価格
    </div>

    <div class="number" id="totalPrice">
      0円
    </div>

  </div>


  <!-- カメラ -->
  <div class="scanner-area">

    <div id="reader"></div>

    <button
      id="startButton"
      class="scan-button"
      onclick="startScanner()"
    >
      📷 カメラを起動
    </button>

    <button
      id="stopButton"
      class="stop-button"
      onclick="stopScanner()"
      style="display:none;"
    >
      カメラを停止
    </button>

  </div>


  <!-- 手入力 -->
  <div class="input-area">

    <input
      type="text"
      id="isbnInput"
      placeholder="ISBNを手入力"
      inputmode="numeric"
    >

    <button
      id="addButton"
      onclick="addBook()"
      style="background:#333;"
    >
      ISBNから本を追加
    </button>

    <div id="message"></div>

  </div>


  <!-- 本の一覧 -->
  <div id="bookList"></div>


  <script>

    let totalBooks = 0;
    let totalPrice = 0;

    let html5QrCode = null;

    // 連続読み取り防止
    let isProcessingScan = false;


    /*
     * ISBNを正規化
     */
    function normalizeISBN(isbn) {

      return isbn
        .replace(/[-\s]/g, "")
        .trim();

    }


    /*
     * ISBNから本の情報を取得
     */
    async function getBookInfo(isbn) {

      const url =
        "https://api.openbd.jp/v1/get?isbn=" +
        encodeURIComponent(isbn);

      const response =
        await fetch(url);

      if (!response.ok) {

        throw new Error(
          "APIへの接続に失敗しました"
        );

      }

      const data =
        await response.json();


      if (!data || !data[0]) {

        return null;

      }


      const book =
        data[0];

      let title =
        "書名不明";

      let price =
        null;


      /*
       * 書名
       */
      if (
        book.summary &&
        book.summary.title
      ) {

        title =
          book.summary.title;

      }


      /*
       * 価格
       */
      if (
        book.onix &&
        book.onix.ProductSupply &&
        book.onix.ProductSupply.SupplyDetail &&
        book.onix.ProductSupply.SupplyDetail.Price
      ) {

        const prices =
          book.onix.ProductSupply
            .SupplyDetail.Price;


        for (
          const priceData of prices
        ) {

          if (
            priceData &&
            priceData.PriceAmount
          ) {

            const amount =
              Number(
                priceData.PriceAmount
              );


            if (
              !isNaN(amount)
            ) {

              price =
                amount;

              break;

            }

          }

        }

      }


      return {
        title: title,
        price: price
      };

    }


    /*
     * 本を追加
     */
    async function addBook(
      isbnFromScanner = null
    ) {

      const input =
        document.getElementById(
          "isbnInput"
        );

      const button =
        document.getElementById(
          "addButton"
        );

      const message =
        document.getElementById(
          "message"
        );


      /*
       * スキャナーから来た場合
       */
      let isbn;

      if (isbnFromScanner) {

        isbn =
          normalizeISBN(
            isbnFromScanner
          );

      } else {

        isbn =
          normalizeISBN(
            input.value
          );

      }


      /*
       * ISBNチェック
       */
      if (
        isbn.length !== 10 &&
        isbn.length !== 13
      ) {

        message.textContent =
          "ISBNは10桁または13桁で入力してください";

        return false;

      }


      button.disabled =
        true;


      message.textContent =
        "本を検索しています…";


      try {

        const book =
          await getBookInfo(
            isbn
          );


        /*
         * 本が見つからない
         */
        if (!book) {

          message.textContent =
            "このISBNの本が見つかりませんでした";

          return false;

        }


        /*
         * 価格がない
         */
        if (
          book.price === null
        ) {

          message.textContent =
            "本は見つかりましたが、価格情報がありません";

          return false;

        }


        /*
         * 合計に追加
         */
        totalBooks++;

        totalPrice +=
          book.price;


        /*
         * 合計表示
         */
        document
          .getElementById(
            "totalBooks"
          )
          .textContent =
          totalBooks + "冊";


        document
          .getElementById(
            "totalPrice"
          )
          .textContent =
          totalPrice.toLocaleString()
          + "円";


        /*
         * 本の一覧
         */
        const bookElement =
          document.createElement(
            "div"
          );

        bookElement.className =
          "book";


        const titleElement =
          document.createElement(
            "div"
          );

        titleElement.className =
          "book-title";

        titleElement.textContent =
          book.title;


        const infoElement =
          document.createElement(
            "div"
          );

        infoElement.className =
          "book-info";

        infoElement.textContent =
          "ISBN: " + isbn;


        const priceElement =
          document.createElement(
            "div"
          );

        priceElement.className =
          "book-price";

        priceElement.textContent =
          "本体価格: " +
          book.price.toLocaleString()
          + "円";


        bookElement.appendChild(
          titleElement
        );

        bookElement.appendChild(
          infoElement
        );

        bookElement.appendChild(
          priceElement
        );


        document
          .getElementById(
            "bookList"
          )
          .appendChild(
            bookElement
          );


        /*
         * 入力欄を空にする
         */
        input.value = "";


        message.textContent =
          "追加しました";


        /*
         * 成功音
         */
        playBeep();


        return true;


      } catch (error) {

        console.error(
          error
        );

        message.textContent =
          "本の情報を取得できませんでした";

        return false;


      } finally {

        button.disabled =
          false;

      }

    }


    /*
     * カメラ起動
     */
    async function startScanner() {

      const message =
        document.getElementById(
          "message"
        );


      try {

        if (!html5QrCode) {

          html5QrCode =
            new Html5Qrcode(
              "reader"
            );

        }


        /*
         * ISBNはEAN-13なので
         * EAN-13だけを読む
         */
        const config = {

          fps: 15,

          qrbox: {
            width: 300,
            height: 120
          },

          aspectRatio: 1.7777778,

          formatsToSupport: [
            Html5QrcodeSupportedFormats.EAN_13
          ]

        };


        /*
         * 背面カメラを使用
         */
        await html5QrCode.start(

          {
            facingMode: "environment"
          },

          config,

          async function (
            decodedText,
            decodedResult
          ) {

            /*
             * 連続検出による二重登録防止
             */
            if (
              isProcessingScan
            ) {

              return;

            }


            /*
             * 数字だけにする
             */
            const isbn =
              normalizeISBN(
                decodedText
              );


            /*
             * EAN-13以外は無視
             */
            if (
              !/^\d{13}$/.test(
                isbn
              )
            ) {

              return;

            }


            /*
             * ISBN-13以外を無視
             *
             * 日本の書籍ISBNは
             * 978 / 979 から始まる
             */
            if (
              !isbn.startsWith("978") &&
              !isbn.startsWith("979")
            ) {

              return;

            }


            isProcessingScan =
              true;


            /*
             * 一度カメラを止める
             *
             * 本の検索中に同じ本を
             * 何度も読み取らないため
             */
            await stopScanner();


            /*
             * ISBNを入力欄にも表示
             */
            document
              .getElementById(
                "isbnInput"
              )
              .value =
              isbn;


            /*
             * 本を追加
             */
            await addBook(
              isbn
            );


            /*
             * 少し待ってから
             * 再びスキャン可能にする
             */
            setTimeout(
              async function () {

                isProcessingScan =
                  false;

                await startScanner();

              },
              500
            );

          },

          function (
            errorMessage
          ) {

            /*
             * 読み取り失敗は無視。
             *
             * カメラを動かしている間は
             * 毎フレームここに来るため、
             * 画面には表示しない。
             */

          }

        );


        document
          .getElementById(
            "startButton"
          )
          .style.display =
          "none";


        document
          .getElementById(
            "stopButton"
          )
          .style.display =
          "block";


        message.textContent =
          "バーコードをカメラに映してください";


      } catch (error) {

        console.error(
          error
        );

        message.textContent =
          "カメラを起動できませんでした。カメラの使用を許可してください。";

      }

    }


    /*
     * カメラ停止
     */
    async function stopScanner() {

      if (
        html5QrCode
      ) {

        try {

          await html5QrCode.stop();

        } catch (error) {

          console.log(
            "カメラ停止:",
            error
          );

        }

      }


      document
        .getElementById(
          "startButton"
        )
        .style.display =
        "block";


      document
        .getElementById(
          "stopButton"
        )
        .style.display =
        "none";

    }


    /*
     * スキャン成功音
     *
     * iPhoneのブラウザでは
     * ユーザー操作後のAudioContextが
     * 必要になる場合がある。
     */
    let audioContext = null;


    function playBeep() {

      try {

        if (!audioContext) {

          audioContext =
            new (
              window.AudioContext ||
              window.webkitAudioContext
            )();

        }


        if (
          audioContext.state ===
          "suspended"
        ) {

          audioContext.resume();

        }


        const oscillator =
          audioContext.createOscillator();

        const gain =
          audioContext.createGain();


        oscillator.type =
          "sine";

        oscillator.frequency.value =
          880;


        gain.gain.setValueAtTime(
          0.001,
          audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
          0.15,
          audioContext.currentTime + 0.01
        );

        gain.gain.exponentialRampToValueAtTime(
          0.001,
          audioContext.currentTime + 0.12
        );


        oscillator.connect(
          gain
        );

        gain.connect(
          audioContext.destination
        );


        oscillator.start();

        oscillator.stop(
          audioContext.currentTime + 0.12
        );


      } catch (error) {

        console.log(
          "音声再生:",
          error
        );

      }

    }


    /*
     * Enterキーで手入力検索
     */
    document
      .getElementById(
        "isbnInput"
      )
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key === "Enter"
          ) {

            addBook();

          }

        }
      );

  </script>

</body>
</html>
