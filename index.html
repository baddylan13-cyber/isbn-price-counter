<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ISBN 本体価格カウンター</title>

  <!-- Tesseract.js -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        sans-serif;

      max-width: 700px;
      margin: 0 auto;
      padding: 20px;

      background: #f5f5f5;
      color: #222;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin: 0 0 20px;
    }

    .summary {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .summary-row {
      display: flex;
      gap: 10px;
      text-align: center;
    }

    .summary-item {
      flex: 1;
    }

    .summary-label {
      font-size: 14px;
      color: #666;
    }

    .summary-value {
      font-size: 28px;
      font-weight: bold;
      margin-top: 5px;
    }

    .section {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .section h2 {
      font-size: 18px;
      margin: 0 0 15px;
    }

    #cameraArea {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 10px;
      background: #111;
    }

    #video {
      display: block;
      width: 100%;
      height: auto;
    }

    /*
      ISBNを合わせる場所
    */

    #scanGuide {
      position: absolute;

      left: 5%;
      right: 5%;

      top: 35%;
      height: 30%;

      border: 3px solid #00e676;
      border-radius: 10px;

      pointer-events: none;
    }

    #scanGuide::after {
      content:
        "ISBNの数字をここに合わせる";

      position: absolute;

      left: 0;
      right: 0;

      bottom: -38px;

      text-align: center;

      color: white;
      background: rgba(0,0,0,0.7);

      padding: 6px;

      font-size: 13px;
    }

    #canvas {
      display: none;
    }

    #previewArea {
      display: none;
      margin-top: 15px;
    }

    #preview {
      width: 100%;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    button {
      width: 100%;

      padding: 14px;

      border: none;
      border-radius: 8px;

      background: #007aff;
      color: white;

      font-size: 17px;
      font-weight: bold;

      cursor: pointer;

      margin-top: 10px;
    }

    button:disabled {
      background: #aaa;
    }

    #stopCamera {
      background: #666;
    }

    #scanButton {
      background: #00a86b;
      font-size: 18px;
      padding: 16px;
    }

    #status {
      text-align: center;

      min-height: 24px;

      margin: 14px 0;

      font-size: 14px;
      color: #555;
    }

    .manual-row {
      display: flex;
      gap: 8px;
    }

    .manual-row input {
      flex: 1;
      min-width: 0;

      padding: 12px;

      font-size: 16px;

      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .manual-row button {
      width: 100px;
      margin-top: 0;
    }

    #bookList {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    #bookList li {
      padding: 12px 4px;
      border-bottom: 1px solid #eee;
    }

    #bookList li:last-child {
      border-bottom: none;
    }

    .book-title {
      font-weight: bold;
    }

    .book-info {
      margin-top: 4px;
      font-size: 13px;
      color: #666;
    }

    .note {
      margin-top: 12px;

      font-size: 13px;
      line-height: 1.6;

      color: #666;
    }

  </style>
</head>


<body>

  <h1>ISBN 本体価格カウンター</h1>


  <!-- ======================
       集計
  ======================= -->

  <div class="summary">

    <div class="summary-row">

      <div class="summary-item">

        <div class="summary-label">
          冊数
        </div>

        <div
          class="summary-value"
          id="totalBooks"
        >
          0
        </div>

      </div>


      <div class="summary-item">

        <div class="summary-label">
          本体価格合計
        </div>

        <div class="summary-value">

          <span id="totalPrice">
            0
          </span>

          円

        </div>

      </div>

    </div>

  </div>


  <!-- ======================
       カメラ
  ======================= -->

  <div class="section">

    <h2>
      📷 カメラでISBNを読み取る
    </h2>


    <div id="cameraArea">

      <video
        id="video"
        playsinline
        autoplay
        muted
      ></video>

      <div id="scanGuide"></div>

    </div>


    <canvas id="canvas"></canvas>


    <div id="previewArea">

      <div
        style="
          font-size:13px;
          color:#666;
          margin-bottom:5px;
        "
      >
        OCRに使用した画像
      </div>

      <img
        id="preview"
        alt="OCR画像"
      >

    </div>


    <div id="status">
      「カメラを起動」を押してください
    </div>


    <button
      id="startCamera"
    >
      📷 カメラを起動
    </button>


    <button
      id="scanButton"
      disabled
    >
      🔍 この画像を読み取る
    </button>


    <button
      id="stopCamera"
      disabled
    >
      カメラを停止
    </button>


    <div class="note">

      バーコードそのものではなく、
      <b>バーコードの下に印刷されているISBNの数字</b>
      を緑の枠に合わせてください。<br>

      数字を枠に合わせたら
      「この画像を読み取る」を押してください。

    </div>

  </div>


  <!-- ======================
       手入力
  ======================= -->

  <div class="section">

    <h2>
      ⌨️ ISBNを手入力
    </h2>

    <div class="manual-row">

      <input
        type="text"
        id="isbnInput"
        placeholder="978xxxxxxxxxx"
        inputmode="numeric"
      >

      <button id="addButton">
        追加
      </button>

    </div>

  </div>


  <!-- ======================
       本一覧
  ======================= -->

  <div class="section">

    <h2>
      📚 読み取った本
    </h2>

    <ul id="bookList"></ul>

  </div>


<script>


  /* =========================
     状態
  ========================= */

  let totalBooks = 0;
  let totalPrice = 0;

  let stream = null;

  let ocrWorker = null;

  let ocrReady = false;

  let processing = false;


  /* =========================
     DOM
  ========================= */

  const video =
    document.getElementById("video");

  const canvas =
    document.getElementById("canvas");

  const ctx =
    canvas.getContext("2d");

  const preview =
    document.getElementById("preview");

  const previewArea =
    document.getElementById("previewArea");

  const statusText =
    document.getElementById("status");

  const startButton =
    document.getElementById("startCamera");

  const scanButton =
    document.getElementById("scanButton");

  const stopButton =
    document.getElementById("stopCamera");

  const isbnInput =
    document.getElementById("isbnInput");

  const addButton =
    document.getElementById("addButton");


  /* =========================
     効果音
  ========================= */

  function beep() {

    try {

      const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

      const audioContext =
        new AudioContext();

      const oscillator =
        audioContext.createOscillator();

      const gain =
        audioContext.createGain();

      oscillator.type =
        "sine";

      oscillator.frequency.value =
        880;

      gain.gain.value =
        0.12;

      oscillator.connect(gain);

      gain.connect(
        audioContext.destination
      );

      oscillator.start();

      oscillator.stop(
        audioContext.currentTime + 0.12
      );

    } catch (error) {

      console.log(
        "beep error",
        error
      );

    }

  }


  /* =========================
     ISBN-13チェック
  ========================= */

  function isValidISBN13(isbn) {

    if (!/^\d{13}$/.test(isbn)) {
      return false;
    }

    if (
      !isbn.startsWith("978") &&
      !isbn.startsWith("979")
    ) {
      return false;
    }

    let sum = 0;

    for (let i = 0; i < 12; i++) {

      const digit =
        Number(isbn[i]);

      if (i % 2 === 0) {
        sum += digit;
      } else {
        sum += digit * 3;
      }

    }

    const checkDigit =
      (10 - (sum % 10)) % 10;

    return (
      checkDigit ===
      Number(isbn[12])
    );

  }


  /* =========================
     OCR結果からISBNを探す
  ========================= */

  function findISBN(text) {

    if (!text) {
      return null;
    }


    console.log(
      "OCR結果:",
      text
    );


    /*
      OCRでは

      978-4-...
      978 4 ...
      9784...

      など色々な形になるため、
      まず数字以外を除去。
    */

    const digits =
      text.replace(/\D/g, "");


    /*
      連続した13桁から探す
    */

    for (
      let i = 0;
      i <= digits.length - 13;
      i++
    ) {

      const candidate =
        digits.substring(
          i,
          i + 13
        );

      if (
        isValidISBN13(candidate)
      ) {

        return candidate;

      }

    }


    /*
      OCRが空白やハイフンを
      含んだ状態で返した場合
    */

    const matches =
      text.match(
        /(?:978|979)[\d\s\-]{10,25}/g
      );


    if (matches) {

      for (
        const match of matches
      ) {

        const candidate =
          match.replace(/\D/g, "");


        if (
          candidate.length === 13 &&
          isValidISBN13(candidate)
        ) {

          return candidate;

        }

      }

    }


    return null;

  }


  /* =========================
     openBD
  ========================= */

  async function getBookInfo(isbn) {

    const url =
      "https://api.openbd.jp/v1/get?isbn=" +
      encodeURIComponent(isbn);


    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        "openBD通信エラー"
      );

    }


    const data =
      await response.json();


    if (
      !data ||
      !data[0]
    ) {

      throw new Error(
        "本が見つかりませんでした"
      );

    }


    const book =
      data[0];


    const summary =
      book.summary || {};


    const title =
      summary.title ||
      "タイトル不明";


    let price = null;


    try {

      const prices =
        book
          .onix
          .ProductSupply
          .SupplyDetail
          .Price;


      if (
        Array.isArray(prices)
      ) {

        for (
          const p of prices
        ) {

          const amount =
            Number(
              p.PriceAmount
            );


          if (
            Number.isFinite(amount) &&
            amount > 0
          ) {

            price = amount;

            break;

          }

        }

      }

    } catch (error) {

      console.log(
        "価格取得エラー",
        error
      );

    }


    if (price === null) {

      throw new Error(
        "本は見つかりましたが、本体価格を取得できませんでした"
      );

    }


    return {
      title,
      price,
      isbn
    };

  }


  /* =========================
     HTMLエスケープ
  ========================= */

  function escapeHTML(str) {

    return String(str)

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

  }


  /* =========================
     本を追加
  ========================= */

  async function addBook(isbn) {

    isbn =
      String(isbn)
        .replace(/\D/g, "");


    if (
      isbn.length !== 13 ||
      !isValidISBN13(isbn)
    ) {

      alert(
        "有効なISBN-13ではありません。\n" +
        "978または979から始まる13桁のISBNを入力してください。"
      );

      return false;

    }


    try {

      statusText.textContent =
        "本の情報を取得中…";


      const book =
        await getBookInfo(isbn);


      totalBooks++;

      totalPrice +=
        book.price;


      document.getElementById(
        "totalBooks"
      ).textContent =
        totalBooks;


      document.getElementById(
        "totalPrice"
      ).textContent =
        totalPrice.toLocaleString();


      const li =
        document.createElement("li");


      li.innerHTML = `

        <div class="book-title">
          ${escapeHTML(book.title)}
        </div>

        <div class="book-info">
          ISBN:
          ${book.isbn}
          ／ 本体価格:
          ${book.price.toLocaleString()}円
        </div>

      `;


      document.getElementById(
        "bookList"
      ).prepend(li);


      beep();


      statusText.textContent =
        "読み取り成功！ 次の本をどうぞ";


      return true;


    } catch (error) {

      console.error(
        error
      );


      statusText.textContent =
        error.message ||
        "本の情報を取得できませんでした";


      return false;

    }

  }


  /* =========================
     OCR準備
  ========================= */

  async function initializeOCR() {

    if (
      ocrWorker &&
      ocrReady
    ) {

      return;

    }


    statusText.textContent =
      "最初の1回だけOCRエンジンを準備します…";


    try {

      ocrWorker =
        await Tesseract.createWorker(
          "eng"
        );


      /*
        ISBNなので数字だけに限定。
      */

      await ocrWorker.setParameters({

        tessedit_char_whitelist:
          "0123456789-",

        /*
          1行の数字として読む
        */

        tessedit_pageseg_mode:
          "7",

        /*
          解像度を指定
        */

        user_defined_dpi:
          "300"

      });


      ocrReady = true;


      statusText.textContent =
        "OCR準備完了";

    } catch (error) {

      console.error(
        "OCR初期化エラー",
        error
      );

      statusText.textContent =
        "OCRエンジンの準備に失敗しました";

      throw error;

    }

  }


  /* =========================
     カメラ起動
  ========================= */

  async function startCamera() {

    if (stream) {
      return;
    }


    try {

      statusText.textContent =
        "カメラを起動しています…";


      stream =
        await navigator.mediaDevices.getUserMedia({

          video: {

            facingMode: {
              ideal: "environment"
            },

            width: {
              ideal: 1920
            },

            height: {
              ideal: 1080
            }

          },

          audio: false

        });


      video.srcObject =
        stream;


      await video.play();


      startButton.disabled =
        true;

      scanButton.disabled =
        false;

      stopButton.disabled =
        false;


      statusText.textContent =
        "ISBNの数字を緑の枠に合わせてください";

    } catch (error) {

      console.error(
        error
      );


      statusText.textContent =
        "カメラを起動できませんでした";


      alert(
        "カメラを起動できませんでした。\n\n" +
        "iPhoneのカメラ使用許可を確認してください。"
      );

    }

  }


  /* =========================
     カメラ停止
  ========================= */

  function stopCamera() {

    if (stream) {

      stream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

      stream = null;

    }


    video.srcObject =
      null;


    startButton.disabled =
      false;

    scanButton.disabled =
      true;

    stopButton.disabled =
      true;


    statusText.textContent =
      "カメラを停止しました";

  }


  /* =========================
     撮影
  ========================= */

  function captureImage() {

    if (
      !video.videoWidth ||
      !video.videoHeight
    ) {

      throw new Error(
        "カメラ映像を取得できません"
      );

    }


    /*
      カメラ映像の
      「緑の枠」に対応する部分だけ
      切り出す。

      実際の映像は横幅いっぱい。
    */

    const sourceWidth =
      video.videoWidth;

    const sourceHeight =
      video.videoHeight;


    /*
      枠の位置

      左 5%
      幅 90%

      上 35%
      高さ 30%
    */

    const cropX =
      sourceWidth * 0.05;

    const cropY =
      sourceHeight * 0.35;

    const cropWidth =
      sourceWidth * 0.90;

    const cropHeight =
      sourceHeight * 0.30;


    /*
      OCR用に2倍程度へ拡大。

      Tesseract.js公式でも
      高解像度化・アップスケールで
      認識率が改善する場合がある。
    */

    const scale = 2;


    canvas.width =
      Math.round(
        cropWidth * scale
      );

    canvas.height =
      Math.round(
        cropHeight * scale
      );


    /*
      少しだけ画質を強調
    */

    ctx.filter =
      "contrast(1.35) brightness(1.05)";


    ctx.drawImage(

      video,

      cropX,
      cropY,
      cropWidth,
      cropHeight,

      0,
      0,
      canvas.width,
      canvas.height

    );


    ctx.filter =
      "none";


    /*
      プレビュー表示
    */

    preview.src =
      canvas.toDataURL(
        "image/jpeg",
        0.95
      );


    previewArea.style.display =
      "block";


    return canvas;

  }


  /* =========================
     OCR実行
  ========================= */

  async function scanISBN() {

    if (
      !stream ||
      processing
    ) {

      return;

    }


    processing = true;

    scanButton.disabled =
      true;


    try {

      statusText.textContent =
        "画像を撮影しています…";


      /*
        カメラが完全に映ってから撮影
      */

      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            200
          )
      );


      const image =
        captureImage();


      statusText.textContent =
        "ISBNを読み取っています…";


      /*
        緑枠部分だけをOCR。

        rectangleを使わず、
        すでに切り出した画像を
        そのまま渡す。
      */

      const result =
        await ocrWorker.recognize(
          image
        );


      const text =
        result.data.text ||
        "";


      console.log(
        "OCR結果:",
        text
      );


      const isbn =
        findISBN(text);


      if (!isbn) {

        statusText.textContent =
          "ISBNを読み取れませんでした";


        alert(
          "ISBNを読み取れませんでした。\n\n" +
          "・数字を緑の枠いっぱいに大きく映す\n" +
          "・ピントが合うまで少し待つ\n" +
          "・明るい場所で試す\n\n" +
          "を試してみてください。"
        );


        return;

      }


      statusText.textContent =
        "ISBN " +
        isbn +
        " を認識しました！";


      /*
        openBDへ問い合わせ
      */

      const success =
        await addBook(isbn);


      if (success) {

        /*
          次の本のために
          プレビューはそのまま残す。

          次に撮影すると上書きされる。
        */

        statusText.textContent =
          "✓ 登録完了！ 次の本をどうぞ";

      }

    } catch (error) {

      console.error(
        "OCRエラー:",
        error
      );


      statusText.textContent =
        "読み取り中にエラーが発生しました";


      alert(
        "読み取り中にエラーが発生しました。\n\n" +
        error.message
      );

    } finally {

      processing = false;

      /*
        カメラが起動中なら
        再び撮影可能にする
      */

      if (stream) {

        scanButton.disabled =
          false;

      }

    }

  }


  /* =========================
     手入力
  ========================= */

  addButton.addEventListener(
    "click",
    async () => {

      const isbn =
        isbnInput.value.trim();


      if (!isbn) {
        return;
      }


      const success =
        await addBook(isbn);


      if (success) {

        isbnInput.value =
          "";

      }

    }
  );


  isbnInput.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter"
      ) {

        addButton.click();

      }

    }
  );


  /* =========================
     ボタン
  ========================= */

  startButton.addEventListener(
    "click",
    async () => {

      /*
        OCRエンジンは
        カメラを使う最初のタイミングで準備。

        カメラ起動と同時に準備して、
        「読み取り」ボタンを押す頃には
        準備が終わっている状態を狙う。
      */

      startCamera();

      initializeOCR()
        .catch(
          error =>
            console.error(
              error
            )
        );

    }
  );


  scanButton.addEventListener(
    "click",
    scanISBN
  );


  stopButton.addEventListener(
    "click",
    stopCamera
  );


  /* =========================
     ページを離れる
  ========================= */

  window.addEventListener(
    "beforeunload",
    async () => {

      stopCamera();

      if (ocrWorker) {

        try {

          await ocrWorker.terminate();

        } catch (error) {

          console.log(error);

        }

      }

    }
  );


</script>

</body>
</html>
